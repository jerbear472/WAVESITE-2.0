<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaveSight - Spot Trends Early</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            line-height: 1.6;
            color: #E8E8E8;
            background: linear-gradient(135deg, #0a1628 0%, #0d2040 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .container {
            text-align: center;
            max-width: 600px;
        }
        .logo {
            font-size: 4rem;
            font-weight: 300;
            margin-bottom: 20px;
        }
        .logo span {
            font-weight: 500;
            background: linear-gradient(90deg, #0066cc, #00a0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.5rem;
            color: #888;
            margin-bottom: 40px;
        }
        .description {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 40px;
        }
        .badges {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }
        .badge {
            background: rgba(0, 160, 255, 0.1);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(0, 160, 255, 0.2);
        }
        .badge-emoji {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .badge-text {
            font-size: 0.9rem;
            color: #00a0ff;
        }
        .links {
            margin-top: 40px;
        }
        .links a {
            color: #00a0ff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.95rem;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .app-store-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: linear-gradient(90deg, #00a0ff, #00d4ff);
            color: #000;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .app-store-btn:hover {
            opacity: 0.9;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Wave<span>Sight</span></div>
        <p class="tagline">Spot Trends Before They Blow Up</p>
        <p class="description">
            Discover and share the hottest trends from TikTok, Instagram, Twitter, and YouTube.
            Earn XP, climb the leaderboard, and become a top trend spotter.
        </p>

        <div class="badges">
            <div class="badge">
                <div class="badge-emoji">🔥</div>
                <div class="badge-text">Hot Trends</div>
            </div>
            <div class="badge">
                <div class="badge-emoji">🏆</div>
                <div class="badge-text">Earn XP</div>
            </div>
            <div class="badge">
                <div class="badge-emoji">🌊</div>
                <div class="badge-text">Ride the Wave</div>
            </div>
        </div>

        <a href="#" class="app-store-btn">Coming Soon on App Store</a>

        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="mailto:support@wavesight.app">Contact</a>
        </div>
    </div>
</body>
</html>
